apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devnov-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devnov-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: devnov-api
  template:
    metadata:
      labels:
        app: devnov-api
    spec:
      containers:
        - name: devnov-api
          image: docker.io/your-dockerhub-username/devnov-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: SQLITE_PATH
              value: /data/devnov.db
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devnov-jwt-secret
                  key: JWT_SECRET
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: devnov-data
---
apiVersion: v1
kind: Service
metadata:
  name: devnov-api
spec:
  type: ClusterIP
  selector:
    app: devnov-api
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devnov-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devnov-frontend
  template:
    metadata:
      labels:
        app: devnov-frontend
    spec:
      containers:
        - name: devnov-frontend
          image: docker.io/your-dockerhub-username/devnov-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: devnov-frontend
spec:
  type: LoadBalancer
  selector:
    app: devnov-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
