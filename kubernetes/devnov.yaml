apiVersion: v1
kind: Secret
metadata:
  name: devnov-jwt-secret
type: Opaque
stringData:
  JWT_SECRET: "devnov-secret-key-12345"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devnov-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devnov-api
  labels:
    app: devnov-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devnov-api
  template:
    metadata:
      labels:
        app: devnov-api
    spec:
      containers:
      - name: devnov-api
        image: devnov-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 4000
          name: http
        env:
        - name: PORT
          value: "4000"
        - name: SQLITE_PATH
          value: "/data/devnov.db"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: devnov-jwt-secret
              key: JWT_SECRET
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: devnov-data
---
apiVersion: v1
kind: Service
metadata:
  name: devnov-api
spec:
  type: ClusterIP
  ports:
  - port: 4000
    targetPort: 4000
  selector:
    app: devnov-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devnov-frontend
  labels:
    app: devnov-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devnov-frontend
  template:
    metadata:
      labels:
        app: devnov-frontend
    spec:
      containers:
      - name: devnov-frontend
        image: devnov-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: devnov-frontend
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  selector:
    app: devnov-frontend
